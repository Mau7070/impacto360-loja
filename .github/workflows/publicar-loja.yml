name: Publicar shopping Impacto360
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gerar catálogo e todas as fichas dos produtos
        run: |
          node scripts/gerar-storefront-excelencia.mjs
          node scripts/gerar-paginas-produtos.mjs
          node scripts/testar-storefront-excelencia.mjs
          node scripts/testar-busca-filtros.mjs
          node scripts/testar-engajamento.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pacote-github-pages-pronto
      - name: Publicar no domínio atual
        id: deployment
        uses: actions/deploy-pages@v4
